app = "sahulatpos"
primary_region = "sin"   # Singapore — closest available to Pakistan

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV   = "production"
  APP_DEBUG = "false"
  LOG_CHANNEL = "stderr"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size   = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source      = "pos_data"
  destination = "/data"
