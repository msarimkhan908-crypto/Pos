<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SahulatPOS — Activate</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1a202c;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.12);
      width: 440px;
      padding: 36px 40px;
    }
    .logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo h1 {
      font-size: 22px;
      font-weight: 700;
      color: #2d6a4f;
      letter-spacing: -0.5px;
    }
    .logo p { font-size: 13px; color: #718096; margin-top: 4px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: #1a202c;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 14px;
    }
    input:focus { border-color: #2d6a4f; }
    .btn {
      width: 100%;
      background: #2d6a4f;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      margin-top: 4px;
    }
    .btn:hover { background: #1f4e3a; }
    .btn:disabled { background: #a0aec0; cursor: not-allowed; }
    .error {
      background: #fff5f5;
      border: 1px solid #feb2b2;
      color: #c53030;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .success {
      background: #f0fff4;
      border: 1px solid #9ae6b4;
      color: #276749;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .footer {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #a0aec0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>SahulatPOS</h1>
      <p>Start your 14-day free trial</p>
    </div>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
    <label for="business_name">Business Name</label>
    <input type="text" id="business_name" placeholder="e.g. Saeed General Store" autocomplete="off">
    <label for="owner_name">Your Name</label>
    <input type="text" id="owner_name" placeholder="e.g. Muhammad Saeed" autocomplete="off">
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="off">
    <label for="phone">Phone (optional)</label>
    <input type="tel" id="phone" placeholder="+92 300 1234567" autocomplete="off">
    <button class="btn" id="submitBtn">Activate Free Trial</button>
    <div class="footer">14-day free trial &bull; No credit card required</div>
  </div>

  <script>
    const btn = document.getElementById('submitBtn');
    const errBox = document.getElementById('error');
    const okBox = document.getElementById('success');

    function showError(msg) {
      errBox.textContent = msg;
      errBox.style.display = 'block';
      okBox.style.display = 'none';
    }
    function showSuccess(msg) {
      okBox.textContent = msg;
      okBox.style.display = 'block';
      errBox.style.display = 'none';
    }

    btn.addEventListener('click', async () => {
      const business_name = document.getElementById('business_name').value.trim();
      const owner_name    = document.getElementById('owner_name').value.trim();
      const email         = document.getElementById('email').value.trim();
      const phone         = document.getElementById('phone').value.trim();

      if (!business_name) { showError('Please enter your business name.'); return; }
      if (!owner_name)    { showError('Please enter your name.'); return; }
      if (!email)         { showError('Please enter your email address.'); return; }

      btn.disabled = true;
      btn.textContent = 'Activating…';
      errBox.style.display = 'none';

      try {
        const result = await window.license.register({ business_name, owner_name, email, phone });
        if (result.ok) {
          showSuccess('Trial activated! Starting SahulatPOS…');
          btn.textContent = 'Starting…';
          setTimeout(() => window.license.registered(true), 1200);
        } else {
          showError(result.message || 'Activation failed. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Activate Free Trial';
        }
      } catch (e) {
        showError('Could not connect to the activation server. Check your internet connection.');
        btn.disabled = false;
        btn.textContent = 'Activate Free Trial';
      }
    });
  </script>
</body>
</html>
